# Serves the RustGIS web app built by the Dockerfile. The image runs nginx as a non-root user, so
# it listens on 8080.

# Trunk names the app's .js and .wasm by their content hash, so they can be cached for good.
# Everything else, the page and the service worker first, is checked on every load, so a new image
# is picked up (the app's new-version notice then offers to reload into it).
map $uri $cache_control {
    default "no-cache";
    "~-[0-9a-f]{8,}(_bg)?\.(js|wasm)$" "public, max-age=31536000, immutable";
}

server {
    # IPv4 only: the base image adds [::] at start-up only where IPv6 exists, and a fixed [::] here
    # would stop nginx from starting where it doesn't.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    # Redirects keep the address the browser used: the container's own port 8080 is often
    # published as another, or behind a proxy.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    # Also through proxies that add a Via header.
    gzip_proxied any;
    # Both JavaScript types: nginx's types use the older one, RFC 9239 the newer.
    gzip_types application/javascript text/javascript application/manifest+json application/wasm
               text/plain;

    # No X-Frame-Options: the Python package's notebook and Qt widgets show the app in a frame
    # (?embed).
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's MIME types have no entry for the web app manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The image's HEALTHCHECK.
    location = /healthz {
        access_log off;
        return 200;
    }
}
