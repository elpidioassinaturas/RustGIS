[package]
name = "rustgis-keychain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L2: the system's secret store (macOS Keychain, Windows Credential Manager, the Secret Service) behind rustgis-data's SecretStore"

[lints]
workspace = true

[dependencies]
rustgis-data = { workspace = true }
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain behind `Services::secrets`.
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# Windows Credential Manager behind `Services::secrets`.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
# The Secret Service (GNOME Keyring, KWallet) behind `Services::secrets`, over pure-Rust D-Bus:
# no openssl, libdbus or tokio. Keep the `cfg` list identical to the one in `src/lib.rs`.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
